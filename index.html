<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo Thông Báo</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green-dark:#1a5c3a;--green-mid:#2d7a52;--green-light:#e8f5ee;--green-pale:#f2faf5;
  --red:#c0392b;--red-light:#fdecea;
  --orange:#e8720a;--orange-light:#fff0e4;
  --teal:#00796b;--teal-light:#e0f2f1;
  --gray-bg:#f0f2f5;--gray-border:#e2e5ea;--gray-text:#6b7280;--dark:#111827;
  --topbar-bg:#fad96a;--topbar-text-dark:#5a2d00;
  --status-urgent-bg:#c0392b;--status-urgent-notimportant-bg:#e07b3a;--status-normal-bg:#00796b;
  --shadow-sm:0 1px 4px rgba(0,0,0,.07);--shadow-lg:0 8px 32px rgba(0,0,0,.15);
  --font:'Be Vietnam Pro',sans-serif;
}
html,body{font-family:var(--font);background:#f0f2f5;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;}
/* ── CARD ── */
.form-card{background:#fff;border-radius:16px;width:100%;max-width:540px;box-shadow:var(--shadow-lg);overflow:hidden;}
.form-header{padding:16px 20px 14px;border-bottom:1.5px solid var(--gray-border);display:flex;align-items:center;gap:10px;background:#fff;}
.form-header-icon{width:34px;height:34px;border-radius:9px;background:var(--topbar-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.form-header-title{font-size:15px;font-weight:800;color:var(--dark);}
.form-header-sub{font-size:11px;color:var(--gray-text);margin-top:1px;}
/* ── BODY ── */
.form-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px;}
.form-label .req{color:var(--red);margin-left:2px;}
.form-input,.form-select,.form-textarea{padding:9px 11px;border:1.5px solid var(--gray-border);border-radius:8px;font-size:13px;color:var(--dark);background:var(--gray-bg);outline:none;transition:border-color .15s,background .15s;font-family:var(--font);width:100%;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--green-dark);background:#fff;}
.form-textarea{resize:vertical;min-height:68px;line-height:1.5;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* ── PRIORITY ── */
.priority-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.priority-opt{padding:9px 8px;border-radius:9px;border:1.5px solid var(--gray-border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray-text);user-select:none;}
.priority-opt:hover{border-color:#c5c9d0;background:var(--gray-bg);}
.priority-opt.selected.p-red{background:var(--red-light);border-color:var(--status-urgent-bg);color:var(--status-urgent-bg);}
.priority-opt.selected.p-orange{background:var(--orange-light);border-color:var(--status-urgent-notimportant-bg);color:var(--status-urgent-notimportant-bg);}
.priority-opt.selected.p-teal{background:var(--teal-light);border-color:var(--status-normal-bg);color:var(--status-normal-bg);}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
/* ── RTE ── */
.rte-wrapper{border:1.5px solid var(--gray-border);border-radius:8px;overflow:hidden;background:#fff;transition:border-color .15s;}
.rte-wrapper:focus-within{border-color:var(--green-dark);}
.rte-toolbar{display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--gray-bg);border-bottom:1px solid var(--gray-border);flex-wrap:wrap;}
.rte-btn{width:28px;height:28px;border-radius:5px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;transition:all .12s;font-family:var(--font);}
.rte-btn:hover{background:#e2e5ea;color:var(--dark);}
.rte-btn.active{background:var(--green-light);color:var(--green-dark);}
.rte-btn svg{width:14px;height:14px;fill:currentColor;}
.rte-sep{width:1px;height:18px;background:var(--gray-border);margin:0 3px;flex-shrink:0;}
.rte-select{padding:3px 6px;border:1px solid var(--gray-border);border-radius:4px;font-size:12px;font-weight:600;color:#374151;background:#fff;cursor:pointer;font-family:var(--font);}
.rte-content{min-height:100px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--dark);outline:none;background:#fff;}
.rte-content:empty::before{content:attr(data-placeholder);color:#9ca3af;pointer-events:none;}
/* ── DATE PICKER ── */
.ldp-wrap{position:relative;display:inline-block;width:100%;}
.ldp-input{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1.5px solid var(--gray-border);border-radius:8px;background:var(--gray-bg);cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none;}
.ldp-input:hover{border-color:var(--green-dark);}
.ldp-input.open{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(26,92,58,.12);background:#fff;}
.ldp-icon{width:16px;height:16px;color:var(--green-dark);flex-shrink:0;}
.ldp-text{flex:1;font-size:13px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ldp-text.ph{color:#9ca3af;}
.ldp-clear{display:flex;align-items:center;justify-content:center;width:18px;height:18px;border:none;background:transparent;color:#aaa;cursor:pointer;border-radius:50%;padding:0;transition:color .15s;flex-shrink:0;}
.ldp-clear svg{width:12px;height:12px;}
.ldp-clear:hover{color:var(--red);}
.ldp-cal{position:absolute;top:calc(100% + 5px);left:0;z-index:400;background:#fff;border:1.5px solid var(--gray-border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 10px 0;width:300px;}
.ldp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ldp-title{font-size:14px;font-weight:800;color:var(--green-dark);}
.ldp-nav{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--gray-border);border-radius:6px;background:transparent;cursor:pointer;color:var(--green-dark);font-size:14px;font-weight:700;transition:background .12s;}
.ldp-nav:hover{background:var(--green-pale);}
.ldp-wds{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px;}
.ldp-wds span{text-align:center;font-size:10px;font-weight:800;color:var(--gray-text);padding:3px 0;}
.ldp-wds .wd-sun{color:var(--red);}
.ldp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.ldp-day{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 1px 3px;border-radius:6px;cursor:pointer;min-height:40px;transition:background .1s;position:relative;}
.ldp-day:hover:not(.ldp-other){background:var(--green-pale);}
.ldp-day.ldp-other{opacity:.25;cursor:default;pointer-events:none;}
.ldp-day .d-sol{font-size:13px;font-weight:700;color:var(--dark);line-height:1.2;}
.ldp-day .d-lun{font-size:9px;color:var(--gray-text);line-height:1.2;margin-top:1px;}
.ldp-day.ldp-today:not(.ldp-sel) .d-sol{color:#f97316;font-weight:800;}
.ldp-day.ldp-today:not(.ldp-sel)::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#f97316;}
.ldp-day.ldp-sel{background:var(--green-dark) !important;}
.ldp-day.ldp-sel .d-sol,.ldp-day.ldp-sel .d-lun{color:#fff !important;}
.ldp-day.ldp-sun:not(.ldp-sel) .d-sol{color:var(--red);}
.ldp-day.ldp-sat:not(.ldp-sel) .d-sol{color:var(--green-dark);}
.ldp-foot{margin-top:8px;padding:8px 2px 10px;border-top:1px solid var(--gray-border);}
.ldp-foot-row{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;}
.ldp-foot-row:last-child{margin-bottom:0;}
.ldp-foot-lbl{font-size:10px;font-weight:700;color:var(--gray-text);min-width:68px;flex-shrink:0;}
.ldp-foot-val{font-size:12px;font-weight:600;color:var(--dark);}
.ldp-foot-val.lunar{color:var(--green-dark);}
/* ── TIME PICKER ── */
.time-pick-row{display:flex;gap:5px;}
.time-pick-row .form-select{flex:1;min-width:0;padding:9px 7px;}
/* ── SUB LABEL ── */
.sub-label{font-size:11px;color:var(--gray-text);margin-bottom:4px;font-weight:500;}
/* ── UPLOAD ── */
.upload-zone{border:2px dashed var(--gray-border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--gray-bg);}
.upload-zone:hover{border-color:var(--green-mid);background:var(--green-pale);}
.upload-text{font-size:12px;color:var(--gray-text);font-weight:500;}
.upload-text strong{color:var(--green-dark);}
/* ── FOOTER ── */
.form-footer{padding:12px 20px 18px;display:flex;gap:9px;justify-content:flex-end;border-top:1.5px solid var(--gray-border);}
.btn-cancel{padding:10px 20px;border-radius:8px;border:1.5px solid var(--gray-border);background:#fff;font-size:13px;font-weight:600;color:var(--gray-text);cursor:pointer;font-family:var(--font);transition:background .15s;}
.btn-cancel:hover{background:var(--gray-bg);}
.btn-save{padding:10px 22px;border-radius:8px;border:none;background:var(--green-dark);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s;}
.btn-save:hover{background:var(--green-mid);}
</style>
</head>
<body>

<div class="form-card">
  <!-- HEADER -->
  <div class="form-header">
    <div class="form-header-icon">📢</div>
    <div>
      <div class="form-header-title">Tạo Thông Báo Mới</div>
      <div class="form-header-sub">Thông báo sẽ được gửi đến toàn chùa</div>
    </div>
  </div>

  <!-- BODY -->
  <div class="form-body">

    <!-- 1. MỨC ĐỘ ƯU TIÊN -->
    <div class="form-group">
      <label class="form-label">Mức Độ Ưu Tiên <span class="req">*</span></label>
      <div class="priority-row">
        <div class="priority-opt p-red selected" onclick="selectPriority(this)">
          <div class="pdot" style="background:var(--status-urgent-bg)"></div>Khẩn Cấp
        </div>
        <div class="priority-opt p-orange" onclick="selectPriority(this)">
          <div class="pdot" style="background:var(--status-urgent-notimportant-bg)"></div>Quan Trọng
        </div>
        <div class="priority-opt p-teal" onclick="selectPriority(this)">
          <div class="pdot" style="background:var(--status-normal-bg)"></div>Tin Tức
        </div>
      </div>
    </div>

    <!-- 2. PHẬN SỰ BAN -->
    <div class="form-group">
      <label class="form-label">Phận Sự Ban <span class="req">*</span></label>
      <select class="form-select">
        <option value="">-- Chọn Ban --</option>
        <option>Sư Phụ</option>
        <option>Ban Lãnh Đạo</option>
        <option>Ban Tri Sự</option>
        <option>Ban Quản Chúng</option>
      </select>
    </div>

    <!-- 3. NỘI DUNG -->
    <div class="form-group">
      <label class="form-label">Nội Dung Thông Báo <span class="req">*</span></label>
      <div class="rte-wrapper">
        <div class="rte-toolbar">
          <select class="rte-select" onchange="execCmd('formatBlock',this.value);this.value='p'">
            <option value="p">Đoạn văn</option>
            <option value="h2">Tiêu đề lớn</option>
            <option value="h3">Tiêu đề nhỏ</option>
          </select>
          <div class="rte-sep"></div>
          <button class="rte-btn" onclick="execRTE('bold')" id="rte-bold"><b>B</b></button>
          <button class="rte-btn" onclick="execRTE('italic')" id="rte-italic"><i>I</i></button>
          <button class="rte-btn" onclick="execRTE('underline')" id="rte-underline"><u>U</u></button>
          <div class="rte-sep"></div>
          <button class="rte-btn" onclick="execRTE('foreColor','#c0392b')" style="color:#c0392b;font-weight:800;">A</button>
          <div class="rte-sep"></div>
          <button class="rte-btn" onclick="execRTE('insertUnorderedList')">
            <svg viewBox="0 0 16 16"><rect x="5" y="3" width="9" height="1.5" rx=".75"/><rect x="5" y="7" width="9" height="1.5" rx=".75"/><rect x="5" y="11" width="9" height="1.5" rx=".75"/><circle cx="2" cy="3.75" r="1"/><circle cx="2" cy="7.75" r="1"/><circle cx="2" cy="11.75" r="1"/></svg>
          </button>
          <button class="rte-btn" onclick="execRTE('insertOrderedList')">
            <svg viewBox="0 0 16 16"><rect x="5" y="3" width="9" height="1.5" rx=".75"/><rect x="5" y="7" width="9" height="1.5" rx=".75"/><rect x="5" y="11" width="9" height="1.5" rx=".75"/><text x="0.5" y="5" font-size="4" font-weight="800" fill="currentColor">1.</text><text x="0.5" y="9" font-size="4" font-weight="800" fill="currentColor">2.</text><text x="0.5" y="13" font-size="4" font-weight="800" fill="currentColor">3.</text></svg>
          </button>
          <div class="rte-sep"></div>
          <button class="rte-btn" onclick="insertLink()">🔗</button>
          <button class="rte-btn" onclick="insertEmoji()">😊</button>
        </div>
        <div class="rte-content" id="rteContent" contenteditable="true"
          data-placeholder="Nhập nội dung thông báo toàn chùa..."
          onkeyup="updateRTEState()" onmouseup="updateRTEState()"></div>
      </div>
    </div>

    <!-- 4. THỜI GIAN DIỄN RA -->
    <div class="form-group">
      <label class="form-label">Thời Gian Diễn Ra <span class="req">*</span></label>

      <!-- Ngày -->
      <div class="form-row">
        <div>
          <div class="sub-label">Ngày bắt đầu</div>
          <div class="ldp-wrap" id="ldpWrap1">
            <div class="ldp-input" id="ldpInput1" onclick="toggleLdp(1)">
              <svg class="ldp-icon" viewBox="0 0 20 20" fill="none">
                <rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 2v4M13 2v4M3 9h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span class="ldp-text ph" id="ldpText1">Chọn ngày...</span>
              <button class="ldp-clear" id="ldpClear1" style="display:none" onclick="clearLdp(event,1)">
                <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="ldp-cal" id="ldpCal1" style="display:none"></div>
          </div>
        </div>
        <div>
          <div class="sub-label">Ngày kết thúc</div>
          <div class="ldp-wrap" id="ldpWrap2">
            <div class="ldp-input" id="ldpInput2" onclick="toggleLdp(2)">
              <svg class="ldp-icon" viewBox="0 0 20 20" fill="none">
                <rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 2v4M13 2v4M3 9h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span class="ldp-text ph" id="ldpText2">Chọn ngày...</span>
              <button class="ldp-clear" id="ldpClear2" style="display:none" onclick="clearLdp(event,2)">
                <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="ldp-cal" id="ldpCal2" style="display:none"></div>
          </div>
        </div>
      </div>

      <!-- Giờ -->
      <div class="form-row" style="margin-top:8px;">
        <div>
          <div class="sub-label">Giờ bắt đầu</div>
          <div class="time-pick-row">
            <select class="form-select" id="timeStartH">
              <option value="">Giờ</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
            </select>
            <select class="form-select" id="timeStartM">
              <option value="">Phút</option>
              <option>00</option><option>15</option><option>30</option><option>45</option>
            </select>
            <select class="form-select" id="timeStartAP">
              <option>AM</option><option>PM</option>
            </select>
          </div>
        </div>
        <div>
          <div class="sub-label">Giờ kết thúc</div>
          <div class="time-pick-row">
            <select class="form-select" id="timeEndH">
              <option value="">Giờ</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
            </select>
            <select class="form-select" id="timeEndM">
              <option value="">Phút</option>
              <option>00</option><option>15</option><option>30</option><option>45</option>
            </select>
            <select class="form-select" id="timeEndAP">
              <option>AM</option><option>PM</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- 5. HÌNH ẢNH -->
    <div class="form-group">
      <label class="form-label">Hình Ảnh (nếu có)</label>
      <div class="upload-zone" onclick="document.getElementById('imgUp').click()">
        <div style="font-size:22px;margin-bottom:6px;">🖼️</div>
        <div class="upload-text"><strong>Nhấn để chọn ảnh</strong> hoặc kéo thả vào đây</div>
        <div class="upload-text" style="font-size:10px;margin-top:3px;opacity:.7;">PNG, JPG · Tối đa 5MB</div>
        <input type="file" id="imgUp" style="display:none" accept="image/*">
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="form-footer">
    <button class="btn-cancel" onclick="resetForm()">Huỷ</button>
    <button class="btn-save" onclick="saveNotif()">💾 Lưu Thông Báo</button>
  </div>
</div>

<script>
// ── LUNAR CALENDAR ─────────────────────────────────────────────
const LDP_CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const LDP_CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const LDP_MONTHS=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

function ldpJdFromDate(d,m,y){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;let jd=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;if(jd<2299161)jd=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;return jd;}
function ldpGetNewMoonDay(k,tz){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1-=0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(2*dr*Mpr)-0.0004*Math.sin(3*dr*Mpr);C1+=0.0104*Math.sin(2*dr*F)-0.0051*Math.sin((M+Mpr)*dr)-0.0074*Math.sin((M-Mpr)*dr)+0.0004*Math.sin((2*F+M)*dr)-0.0004*Math.sin((2*F-M)*dr)-0.0006*Math.sin((2*F+Mpr)*dr)+0.001*Math.sin((2*F-Mpr)*dr)+0.0005*Math.sin((M+2*Mpr)*dr);let dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return Math.floor(Jd1+C1-dt+0.5+tz/24);}
function ldpGetSunLong(jdn,tz){const T=(jdn-2451545.5-tz/24)/36525,T2=T*T,dr=Math.PI/180,M=357.5291+35999.0503*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.9146-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.00029*Math.sin(dr*3*M);let L=(L0+DL)*dr;L-=2*Math.PI*Math.floor(L/(2*Math.PI));return Math.floor(L/Math.PI*6);}
function ldpGetLunarMonth11(y,tz){const off=ldpJdFromDate(31,12,y)-2415021,k=Math.floor(off/29.530588853);let nm=ldpGetNewMoonDay(k,tz);if(ldpGetSunLong(nm,tz)>=9)nm=ldpGetNewMoonDay(k-1,tz);return nm;}
function ldpGetLeapOffset(a11,tz){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=ldpGetSunLong(ldpGetNewMoonDay(k+i,tz),tz);do{last=arc;i++;arc=ldpGetSunLong(ldpGetNewMoonDay(k+i,tz),tz);}while(arc!==last&&i<14);return i-1;}
function ldpSolar2Lunar(d,m,y){const tz=7,jd=ldpJdFromDate(d,m,y),k=Math.floor((jd-2415021.076998695)/29.530588853);let ms=ldpGetNewMoonDay(k+1,tz);if(ms>jd)ms=ldpGetNewMoonDay(k,tz);let a11=ldpGetLunarMonth11(y,tz),b11=a11,ly;if(a11>=ms){ly=y;a11=ldpGetLunarMonth11(y-1,tz);}else{ly=y+1;b11=ldpGetLunarMonth11(y+1,tz);}const lday=jd-ms+1,diff=Math.floor((ms-a11)/29);let leap=0,lmonth=diff+11;if(b11-a11>365){const lo=ldpGetLeapOffset(a11,tz);if(diff>=lo){lmonth=diff+10;if(diff===lo)leap=1;}}if(lmonth>12)lmonth-=12;if(lmonth>=11&&diff<4)ly--;return{day:lday,month:lmonth,year:ly,isLeap:leap===1,canChiYear:LDP_CAN[(ly+6)%10]+' '+LDP_CHI[(ly+8)%12]};}
function ldpPad(n){return String(n).padStart(2,'0');}
function ldpFmtSolar(d){return`${ldpPad(d.getDate())}/${ldpPad(d.getMonth()+1)}/${d.getFullYear()}`;}

const ldpState={
  1:{viewY:new Date().getFullYear(),viewM:new Date().getMonth(),sel:null},
  2:{viewY:new Date().getFullYear(),viewM:new Date().getMonth(),sel:null}
};
const ldpToday=new Date();

function ldpBuildCal(idx){
  const s=ldpState[idx],cal=document.getElementById('ldpCal'+idx),{viewY:y,viewM:m}=s,days=[];
  const first=new Date(y,m,1);let dow=first.getDay()-1;if(dow<0)dow=6;
  const prevLast=new Date(y,m,0).getDate();
  for(let i=dow-1;i>=0;i--)days.push({date:new Date(y,m-1,prevLast-i),other:true});
  const dim=new Date(y,m+1,0).getDate();
  for(let d=1;d<=dim;d++)days.push({date:new Date(y,m,d),other:false});
  const need=Math.ceil(days.length/7)*7;
  for(let n=1;days.length<need;n++)days.push({date:new Date(y,m+1,n),other:true});
  let html=`<div class="ldp-hdr"><button class="ldp-nav" onclick="ldpNav(${idx},-1)">‹</button><span class="ldp-title">${LDP_MONTHS[m]} ${y}</span><button class="ldp-nav" onclick="ldpNav(${idx},1)">›</button></div><div class="ldp-wds"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span class="wd-sun">CN</span></div><div class="ldp-days">`;
  days.forEach(item=>{
    const lun=ldpSolar2Lunar(item.date.getDate(),item.date.getMonth()+1,item.date.getFullYear());
    const isTd=item.date.getFullYear()===ldpToday.getFullYear()&&item.date.getMonth()===ldpToday.getMonth()&&item.date.getDate()===ldpToday.getDate();
    const isSel=s.sel&&item.date.getFullYear()===s.sel.getFullYear()&&item.date.getMonth()===s.sel.getMonth()&&item.date.getDate()===s.sel.getDate();
    const isSun=item.date.getDay()===0,isSat=item.date.getDay()===6;
    const cls=['ldp-day',item.other?'ldp-other':'',isTd?'ldp-today':'',isSel?'ldp-sel':'',isSun?'ldp-sun':'',isSat?'ldp-sat':''].filter(Boolean).join(' ');
    const ca=item.other?'':`onclick="ldpSelectDay(${idx},new Date(${item.date.getFullYear()},${item.date.getMonth()},${item.date.getDate()}))"`;
    html+=`<div class="${cls}" ${ca}><span class="d-sol">${item.date.getDate()}</span><span class="d-lun">${lun.day}/${lun.month}</span></div>`;
  });
  html+=`</div>`;
  if(s.sel){
    const lun=ldpSolar2Lunar(s.sel.getDate(),s.sel.getMonth()+1,s.sel.getFullYear());
    html+=`<div class="ldp-foot"><div class="ldp-foot-row"><span class="ldp-foot-lbl">Dương lịch:</span><span class="ldp-foot-val">${ldpFmtSolar(s.sel)}</span></div><div class="ldp-foot-row"><span class="ldp-foot-lbl">Âm lịch:</span><span class="ldp-foot-val lunar">Ngày ${lun.day} tháng ${lun.month}${lun.isLeap?' (nhuận)':''} năm ${lun.canChiYear}</span></div></div>`;
  }
  cal.innerHTML=html;
}

// Hiển thị trong ô: CHỈ ngày âm — "17/3/Âm Lịch"
function ldpSelectDay(idx,date){
  const s=ldpState[idx];s.sel=date;
  const lun=ldpSolar2Lunar(date.getDate(),date.getMonth()+1,date.getFullYear());
  const textEl=document.getElementById('ldpText'+idx);
  textEl.textContent=`${lun.day}/${lun.month}/Âm Lịch`;
  textEl.classList.remove('ph');
  document.getElementById('ldpClear'+idx).style.display='flex';
  ldpBuildCal(idx);
  setTimeout(()=>{document.getElementById('ldpCal'+idx).style.display='none';document.getElementById('ldpInput'+idx).classList.remove('open');},120);
}
function ldpNav(idx,dir){const s=ldpState[idx];s.viewM+=dir;if(s.viewM>11){s.viewM=0;s.viewY++;}if(s.viewM<0){s.viewM=11;s.viewY--;}ldpBuildCal(idx);}
let ldpOpenIdx=null;
function toggleLdp(idx){
  const cal=document.getElementById('ldpCal'+idx),inp=document.getElementById('ldpInput'+idx),isOpen=cal.style.display!=='none';
  [1,2].forEach(i=>{document.getElementById('ldpCal'+i).style.display='none';document.getElementById('ldpInput'+i).classList.remove('open');});
  ldpOpenIdx=null;
  if(!isOpen){ldpBuildCal(idx);cal.style.display='block';inp.classList.add('open');ldpOpenIdx=idx;}
}
function clearLdp(e,idx){
  e.stopPropagation();ldpState[idx].sel=null;
  const textEl=document.getElementById('ldpText'+idx);
  textEl.textContent='Chọn ngày...';textEl.classList.add('ph');
  document.getElementById('ldpClear'+idx).style.display='none';
  ldpBuildCal(idx);
}

// ── RTE ────────────────────────────────────────────────────────
function execRTE(cmd,val){document.getElementById('rteContent').focus();document.execCommand(cmd,false,val||null);updateRTEState();}
function execCmd(cmd,val){document.getElementById('rteContent').focus();document.execCommand(cmd,false,val);}
function updateRTEState(){['bold','italic','underline'].forEach(cmd=>{const el=document.getElementById('rte-'+cmd);if(el)el.classList.toggle('active',document.queryCommandState(cmd));});}
function insertLink(){const url=prompt('Nhập địa chỉ link:');if(url)execRTE('createLink',url);}
function insertEmoji(){const emojis=['🙏','📢','⚠️','✅','❌','📅','🔔','🌸','⭐','🕐'];document.getElementById('rteContent').focus();document.execCommand('insertText',false,emojis[Math.floor(Math.random()*emojis.length)]);}

// ── PRIORITY ───────────────────────────────────────────────────
function selectPriority(el){document.querySelectorAll('.priority-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');}

// ── FORM ACTIONS ───────────────────────────────────────────────
function resetForm(){
  document.querySelectorAll('.priority-opt').forEach(o=>o.classList.remove('selected'));
  document.querySelector('.priority-opt.p-red').classList.add('selected');
  document.querySelectorAll('.form-select').forEach(s=>s.selectedIndex=0);
  document.getElementById('rteContent').innerHTML='';
  [1,2].forEach(i=>clearLdp({stopPropagation:()=>{}},i));
}
function saveNotif(){alert('✓ Thông báo đã được lưu!');}

// ── CLOSE DROPDOWNS ON OUTSIDE CLICK ──────────────────────────
document.addEventListener('click',e=>{
  [1,2].forEach(idx=>{
    const wrap=document.getElementById('ldpWrap'+idx);
    if(wrap&&!wrap.contains(e.target)){
      document.getElementById('ldpCal'+idx).style.display='none';
      document.getElementById('ldpInput'+idx).classList.remove('open');
    }
  });
});
</script>
